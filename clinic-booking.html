<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4CAF50">
    <title>תור מרפאת ילדים - ליברמת אפעל</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }

        .tab-button {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-button.active {
            color: #4CAF50;
            border-bottom-color: #4CAF50;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px solid #4CAF50;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            color: #4CAF50;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .month-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .month-selector button {
            background: #f0f0f0;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .month-selector button:active {
            background: #e0e0e0;
        }

        .month-selector button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .current-month {
            flex: 1;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            color: #333;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .day-header {
            text-align: center;
            font-weight: bold;
            color: #666;
            font-size: 12px;
            padding: 8px 0;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            border: 2px solid transparent;
            background: #f9f9f9;
            position: relative;
        }

        .day.other-month {
            color: #ccc;
            cursor: default;
        }

        .day.past {
            background: #e0e0e0;
            color: #999;
            cursor: default;
        }

        .day.available {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #4CAF50;
        }

        .day.available:active {
            background: #4CAF50;
            color: white;
        }

        .day.selected {
            background: #4CAF50;
            color: white;
            font-weight: bold;
        }

        .day.selected::after {
            content: '✓';
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .slots-container {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .slots-container.active {
            display: block;
        }

        .slots-title {
            font-weight: bold;
            margin-bottom: 12px;
            color: #333;
            text-align: center;
        }

        .time-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .time-slot {
            padding: 12px;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            background: white;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
        }

        .time-slot:active {
            background: #4CAF50;
            color: white;
        }

        .time-slot.selected {
            background: #4CAF50;
            color: white;
        }

        .time-slot.booked {
            background: #ffebee;
            border-color: #f44336;
            color: #f44336;
            cursor: not-allowed;
        }

        .confirmation {
            display: none;
            background: #f0f8f0;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
            margin-bottom: 20px;
        }

        .confirmation.active {
            display: block;
        }

        .confirmation-text {
            font-size: 14px;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .booking-details {
            background: #fff;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 13px;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-confirm {
            background: #4CAF50;
            color: white;
        }

        .btn-confirm:active {
            background: #388e3c;
            transform: scale(0.98);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:active {
            background: #e0e0e0;
            transform: scale(0.98);
        }

        .btn-delete {
            background: #f44336;
            color: white;
            font-size: 12px;
            padding: 6px 12px;
        }

        .btn-delete:active {
            background: #d32f2f;
        }

        .info-text {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 15px;
            line-height: 1.4;
        }

        .bookings-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .booking-card {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            border-right: 4px solid #4CAF50;
            font-size: 13px;
            line-height: 1.6;
        }

        .booking-card.past {
            opacity: 0.6;
            border-right-color: #999;
        }

        .booking-card-header {
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        .booking-card-info {
            color: #666;
            margin-bottom: 8px;
        }

        .booking-card-actions {
            display: flex;
            gap: 8px;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(10px, env(safe-area-inset-left));
                padding-right: max(10px, env(safe-area-inset-right));
                padding-bottom: max(10px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 מרפאת ילדים</h1>
            <p class="subtitle">ליברמת אפעל - זימון תור</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('booking')">זימון תור</button>
            <button class="tab-button" onclick="switchTab('bookings')">ניהול תורים</button>
        </div>

        <!-- TAB 1: BOOKING -->
        <div id="booking" class="tab-content active">
            <div class="form-group">
                <label>שם המטופל *</label>
                <input type="text" id="patientName" placeholder="הכנס שם מלא">
            </div>

            <div class="form-group">
                <label>תעודת זהות *</label>
                <input type="text" id="patientId" placeholder="הכנס ת.ז">
            </div>

            <div class="form-group">
                <label>קופת חולים *</label>
                <select id="insurance">
                    <option value="">בחר קופת חולים</option>
                    <option value="clalit">קופת חולים כללית</option>
                    <option value="maccabi">מכבי</option>
                    <option value="meuhedet">מאוחדת</option>
                    <option value="leumit">לאומית</option>
                    <option value="private">פרטית</option>
                </select>
            </div>

            <div class="month-selector">
                <button id="prevBtn" onclick="previousMonth()">◀ הקודם</button>
                <div class="current-month" id="currentMonth"></div>
                <button id="nextBtn" onclick="nextMonth()">הבא ▶</button>
            </div>

            <div class="calendar" id="calendar"></div>

            <div class="slots-container" id="slotsContainer">
                <div class="slots-title">בחר שעה (10 דקות)</div>
                <div class="time-slots" id="timeSlots"></div>
                
                <div class="confirmation" id="confirmation">
                    <div class="confirmation-text">✓ התור שלך</div>
                    <div class="booking-details">
                        <div id="selectedPatientName"></div>
                        <div id="selectedPatientId"></div>
                        <div id="selectedInsurance"></div>
                        <div id="selectedDate"></div>
                        <div id="selectedTime"></div>
                    </div>
                    <div class="button-group">
                        <button class="btn btn-confirm" onclick="confirmBooking()">אישור התור</button>
                        <button class="btn btn-reset" onclick="resetSelection()">בחר מחדש</button>
                    </div>
                </div>
            </div>

            <div class="info-text">
                ⏰ שעות פעילות: 08:00 - 18:00<br>
                📞 לביטול תור: התקשרו אלינו
            </div>
        </div>

        <!-- TAB 2: BOOKINGS MANAGEMENT -->
        <div id="bookings" class="tab-content">
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-number" id="totalBookings">0</div>
                    <div class="stat-label">סך תורים</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="availableSlots">60</div>
                    <div class="stat-label">זמנים פנויים</div>
                </div>
            </div>

            <div class="bookings-list" id="bookingsList">
                <div class="empty-message">אין תורים עדיין</div>
            </div>

            <div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #e0e0e0;">
                <button class="btn btn-reset" onclick="exportData()" style="width: 100%; margin-bottom: 10px;">📥 ייצוא נתונים (JSON)</button>
                <button class="btn btn-reset" onclick="clearAllData()" style="width: 100%; background: #ffebee; color: #f44336;">🗑️ מחק הכל</button>
            </div>
        </div>
    </div>

    <script>
        const CLINIC_HOURS = {
            start: 8,
            end: 18,
            slotDuration: 10
        };

        let currentDate = new Date();
        let selectedDate = null;
        let selectedTime = null;
        let bookings = JSON.parse(localStorage.getItem('clinicBookings') || '[]');

        // Initialize
        function init() {
            renderCalendar();
            renderTimeSlots();
            updateStats();
        }

        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'bookings') {
                renderBookingsList();
            }
        }

        function getDaysInMonth(date) {
            return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
        }

        function getFirstDayOfMonth(date) {
            return new Date(date.getFullYear(), date.getMonth(), 1).getDay();
        }

        function formatHebrewMonth(date) {
            const months = [
                'ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני',
                'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'
            ];
            return `${months[date.getMonth()]} ${date.getFullYear()}`;
        }

        function isPast(date) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return date < today;
        }

        function isSlotBooked(date, time) {
            const dateStr = date.toISOString().split('T')[0];
            return bookings.some(b => b.date === dateStr && b.time === time);
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = getDaysInMonth(currentDate);
            const firstDay = getFirstDayOfMonth(currentDate);

            document.getElementById('currentMonth').textContent = formatHebrewMonth(currentDate);
            document.getElementById('prevBtn').disabled = isPast(new Date(year, month, 1));

            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';

            // Day headers
            const dayHeaders = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
            dayHeaders.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.textContent = day;
                calendar.appendChild(dayHeader);
            });

            // Empty cells
            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'day other-month';
                calendar.appendChild(emptyDay);
            }

            // Day cells
            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const dayElement = document.createElement('div');
                dayElement.className = 'day';
                dayElement.textContent = day;

                if (isPast(dateObj)) {
                    dayElement.classList.add('past');
                } else {
                    dayElement.classList.add('available');
                    dayElement.onclick = () => selectDate(dateObj);
                }

                if (selectedDate && selectedDate.toDateString() === dateObj.toDateString()) {
                    dayElement.classList.add('selected');
                }

                calendar.appendChild(dayElement);
            }
        }

        function generateTimeSlots() {
            const slots = [];
            for (let hour = CLINIC_HOURS.start; hour < CLINIC_HOURS.end; hour++) {
                for (let minute = 0; minute < 60; minute += CLINIC_HOURS.slotDuration) {
                    slots.push(`${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`);
                }
            }
            return slots;
        }

        function renderTimeSlots() {
            const slots = generateTimeSlots();
            const slotsContainer = document.getElementById('timeSlots');
            slotsContainer.innerHTML = '';

            slots.forEach(slot => {
                const slotButton = document.createElement('button');
                slotButton.className = 'time-slot';
                slotButton.textContent = slot;

                if (selectedDate && isSlotBooked(selectedDate, slot)) {
                    slotButton.classList.add('booked');
                    slotButton.disabled = true;
                } else {
                    slotButton.onclick = () => selectTime(slot, slotButton);
                }

                if (selectedTime === slot) {
                    slotButton.classList.add('selected');
                }

                slotsContainer.appendChild(slotButton);
            });
        }

        function validateForm() {
            const name = document.getElementById('patientName').value.trim();
            const id = document.getElementById('patientId').value.trim();
            const insurance = document.getElementById('insurance').value;

            if (!name) {
                alert('אנא הכנס שם מטופל');
                return false;
            }
            if (!id) {
                alert('אנא הכנס תעודת זהות');
                return false;
            }
            if (!insurance) {
                alert('אנא בחר קופת חולים');
                return false;
            }
            return true;
        }

        function selectDate(dateObj) {
            if (!validateForm()) return;

            selectedDate = dateObj;
            selectedTime = null;
            renderCalendar();
            renderTimeSlots();
            document.getElementById('slotsContainer').classList.add('active');
            document.getElementById('confirmation').classList.remove('active');
        }

        function selectTime(time, element) {
            selectedTime = time;
            document.querySelectorAll('.time-slot').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            showConfirmation();
        }

        function showConfirmation() {
            const hebrewDays = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
            const dayName = hebrewDays[selectedDate.getDay()];
            const dateStr = `${dayName}, ${selectedDate.getDate()}`;
            const name = document.getElementById('patientName').value;
            const id = document.getElementById('patientId').value;
            const insurance = document.getElementById('insurance').options[document.getElementById('insurance').selectedIndex].text;

            document.getElementById('selectedPatientName').innerHTML = `👤 <strong>${name}</strong>`;
            document.getElementById('selectedPatientId').innerHTML = `🆔 <strong>${id}</strong>`;
            document.getElementById('selectedInsurance').innerHTML = `🏥 <strong>${insurance}</strong>`;
            document.getElementById('selectedDate').innerHTML = `📅 <strong>${dateStr}</strong>`;
            document.getElementById('selectedTime').innerHTML = `🕐 <strong>${selectedTime}</strong>`;
            document.getElementById('confirmation').classList.add('active');
        }

        function confirmBooking() {
            const booking = {
                id: Date.now(),
                name: document.getElementById('patientName').value,
                patientId: document.getElementById('patientId').value,
                insurance: document.getElementById('insurance').options[document.getElementById('insurance').selectedIndex].text,
                date: selectedDate.toISOString().split('T')[0],
                time: selectedTime,
                confirmed: new Date().toISOString()
            };

            bookings.push(booking);
            localStorage.setItem('clinicBookings', JSON.stringify(bookings));

            alert(`✓ התור אושר!\n\n${booking.name}\n${booking.date} בשעה ${booking.time}`);
            resetSelection();
            updateStats();
        }

        function resetSelection() {
            selectedDate = null;
            selectedTime = null;
            document.getElementById('patientName').value = '';
            document.getElementById('patientId').value = '';
            document.getElementById('insurance').value = '';
            document.getElementById('slotsContainer').classList.remove('active');
            document.getElementById('confirmation').classList.remove('active');
            renderCalendar();
            renderTimeSlots();
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        function renderBookingsList() {
            const listContainer = document.getElementById('bookingsList');
            const now = new Date();

            if (bookings.length === 0) {
                listContainer.innerHTML = '<div class="empty-message">אין תורים עדיין</div>';
                return;
            }

            // Sort by date
            const sorted = [...bookings].sort((a, b) => new Date(a.date) - new Date(b.date));

            listContainer.innerHTML = sorted.map(booking => {
                const bookingDate = new Date(booking.date + 'T00:00:00');
                const isPastBooking = bookingDate < now;

                return `
                    <div class="booking-card ${isPastBooking ? 'past' : ''}">
                        <div class="booking-card-header">${booking.name}</div>
                        <div class="booking-card-info">
                            🆔 ${booking.patientId}<br>
                            🏥 ${booking.insurance}<br>
                            📅 ${booking.date} בשעה ${booking.time}
                        </div>
                        <div class="booking-card-actions">
                            <button class="btn btn-delete" onclick="deleteBooking(${booking.id})">מחק</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deleteBooking(id) {
            if (confirm('האם אתה בטוח שברצונך למחוק את התור?')) {
                bookings = bookings.filter(b => b.id !== id);
                localStorage.setItem('clinicBookings', JSON.stringify(bookings));
                renderBookingsList();
                updateStats();
            }
        }

        function updateStats() {
            const totalBookings = bookings.length;
            const slotsPerDay = generateTimeSlots().length;
            const daysToCount = 30; // Count for next 30 days
            const bookedSlots = bookings.length;
            const availableSlots = (slotsPerDay * daysToCount) - bookedSlots;

            document.getElementById('totalBookings').textContent = totalBookings;
            document.getElementById('availableSlots').textContent = Math.max(0, availableSlots);
        }

        function exportData() {
            if (bookings.length === 0) {
                alert('אין נתונים לייצוא');
                return;
            }

            const dataStr = JSON.stringify(bookings, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `clinic-bookings-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function clearAllData() {
            if (confirm('⚠️ האם אתה בטוח? פעולה זו תמחק את כל התורים!')) {
                bookings = [];
                localStorage.setItem('clinicBookings', JSON.stringify(bookings));
                renderBookingsList();
                updateStats();
                alert('✓ כל הנתונים נמחקו');
            }
        }

        // Initialize on load
        window.addEventListener('load', init);
    </script>
